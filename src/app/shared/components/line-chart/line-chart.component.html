<div class="line-chart">
  <ngx-charts-line-chart
    [results]="chartData"
    [scheme]="colorScheme"
    [animations]="false"
    [legend]="false"
    [showXAxisLabel]="true"
    [showYAxisLabel]="true"
    [xAxis]="true"
    [yAxis]="true"
    [autoScale]="true"
    [timeline]="false"
    [roundDomains]="true"
    [xAxisLabel]="'Year'"
    [yAxisLabel]="'Medals'"
  ></ngx-charts-line-chart>
</div>
